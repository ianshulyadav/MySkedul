apply plugin: 'com.android.application'

android {
    namespace = "com.myskedul.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.myskedul.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.3.04"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    
    // Optimization: Generate only High-end (arm64) and Low-end (arm-v7a) APKs
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk false
        }
        density {
            enable false
        }
    }

    signingConfigs {
        release {
            def localKeystore = file("release.keystore")
            def customKeystore = file("C:/Users/offic/Documents/myskedulkey/my-releasekey.jks")
            if (System.getenv("RELEASE_KEYSTORE_DECODED") != null) {
                storeFile localKeystore
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            } else if (customKeystore.exists()) {
                storeFile customKeystore
                storePassword "MySkedul@Release2026"
                keyAlias "my-release-key"
                keyPassword "MySkedul@Release2026"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        nightly {
            initWith release
            minifyEnabled true
            shrinkResources true
            matchingFallbacks = ['release']
            if (System.getenv("RELEASE_KEYSTORE_DECODED") != null || file("C:/Users/offic/Documents/myskedulkey/my-releasekey.jks").exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("RELEASE_KEYSTORE_DECODED") != null || file("C:/Users/offic/Documents/myskedulkey/my-releasekey.jks").exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    // Professional Renaming Engine: Naming files dynamically based on version, buildType, and ABI
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def version = variant.versionName
            def buildType = variant.buildType.name
            def nameSuffix = ""
            if (buildType == 'nightly') {
                nameSuffix = "-nightly"
            }
            if (abi == 'arm64-v8a') {
                outputFileName = "MySkedul-v${version}${nameSuffix}-high.apk"
                output.versionCodeOverride = variant.versionCode * 10 + 2
            } else if (abi == 'armeabi-v7a') {
                outputFileName = "MySkedul-v${version}${nameSuffix}-low.apk"
                output.versionCodeOverride = variant.versionCode * 10 + 1
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists()) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
