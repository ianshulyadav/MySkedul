name: Build Release APK

on:
  push:
    branches:
      - 'main'
    paths:
      - 'version.json'
      - 'MySkedulAPP/www/update-system.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          cd MySkedulAPP
          npm install

      - name: Sync Capacitor Web Assets
        run: |
          cd MySkedulAPP
          npx cap sync android

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore File
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > MySkedulAPP/android/app/release.keystore

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd MySkedulAPP/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: MySkedul-Release-APKs
          path: MySkedulAPP/android/app/build/outputs/apk/release/*.apk

      - name: Extract Version and Changelog
        id: parse_version
        run: |
          VERSION=$(jq -r '.version' version.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # Extract changelog and strip HTML tags to make it clean markdown for GitHub Release
          echo "### 🚀 What's Changed in v$VERSION" > body.txt
          echo "" >> body.txt
          jq -r '.changelog[]' version.json | sed -e 's/<[^>]*>//g' | sed -e 's/^/ - /' >> body.txt
          echo "" >> body.txt
          echo "*(Automated build from GitHub Action)*" >> body.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "MySkedul v${{ env.VERSION }}"
          body_path: body.txt
          draft: false
          prerelease: false
          files: |
            MySkedulAPP/android/app/build/outputs/apk/release/*.apk
