name: Build Nightly APK

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
    paths-ignore:
      - 'version.json'
  workflow_dispatch:

jobs:
  build:
    name: Build Nightly APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          cd MySkedulAPP
          npm install

      - name: Patch Nightly Version String
        run: |
          sed -i "s/const CURRENT_APP_VERSION = '1.3.04';/const CURRENT_APP_VERSION = '1.3.04-nightly';/g" MySkedulAPP/www/update-system.js
          sed -i "s/v1.3.04<\/span>/v1.3.04 (Nightly)<\/span>/g" MySkedulAPP/www/index.html

      - name: Sync Capacitor Web Assets
        run: |
          cd MySkedulAPP
          npx cap sync android

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Nightly APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd MySkedulAPP/android
          chmod +x gradlew
          ./gradlew assembleNightly

      - name: Upload Nightly APKs
        uses: actions/upload-artifact@v4
        with:
          name: MySkedul-Nightly-APKs
          path: MySkedulAPP/android/app/build/outputs/apk/nightly/*.apk
